<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EV保守 価格比較表 作成ツール</title>
<style>
:root{
  --ink:#1a1d21; --muted:#6b7280; --line:#d7dbe0; --bg:#f4f6f8; --panel:#fff;
  --accent:#1b3a5c; --accent-weak:#e8eef4; --danger:#c0392b;
  --ok:#1e7b46; --warn:#a8710a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.6 "Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
button{font:inherit; cursor:pointer}
input,select,textarea{font:inherit; color:inherit}

/* ---------- 画面の骨格 ---------- */
.app{display:flex; flex-direction:column; height:100vh}
.bar{
  display:flex; align-items:center; gap:14px; padding:10px 18px;
  background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
}
.bar img{height:30px}
.bar h1{font-size:15px; margin:0; font-weight:700; letter-spacing:.02em}
.bar .spacer{flex:1}
.chip{
  font-size:12px; padding:3px 10px; border-radius:999px;
  background:var(--accent-weak); color:var(--accent); white-space:nowrap;
}
.chip.off{background:#fdeaea; color:var(--danger)}
.btn{
  border:1px solid var(--line); background:#fff; border-radius:6px;
  padding:6px 13px; color:var(--ink);
}
.btn:hover{background:#f0f3f6}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:#24507e}
.btn.ghost{border-color:transparent; background:transparent; color:var(--muted)}
.btn:disabled{opacity:.45; cursor:default}

.body{display:flex; flex:1; min-height:0}
.side{
  width:270px; flex:0 0 auto; background:var(--panel);
  border-right:1px solid var(--line); display:flex; flex-direction:column;
}
.side .head{padding:12px; border-bottom:1px solid var(--line); display:grid; gap:8px}
.side input[type=search]{
  width:100%; padding:6px 9px; border:1px solid var(--line); border-radius:6px;
}
.case-list{list-style:none; margin:0; padding:6px; overflow:auto; flex:1}
.case-list li{
  padding:9px 10px; border-radius:6px; cursor:pointer; border:1px solid transparent;
}
.case-list li:hover{background:#f2f5f8}
.case-list li.on{background:var(--accent-weak); border-color:#c4d5e6}
.case-list .t{font-weight:600; font-size:13px}
.case-list .m{font-size:11px; color:var(--muted)}

.work{flex:1; min-width:0; display:flex; flex-direction:column}
.tabs{display:flex; gap:2px; padding:0 16px; background:var(--panel); border-bottom:1px solid var(--line)}
.tabs button{
  border:0; background:transparent; padding:11px 16px; color:var(--muted);
  border-bottom:2px solid transparent; font-weight:600; font-size:13px;
}
.tabs button.on{color:var(--accent); border-bottom-color:var(--accent)}
.pane{display:none; padding:18px; overflow:auto; flex:1}
.pane.on{display:block}
.empty{color:var(--muted); text-align:center; padding:60px 20px}

/* ---------- フォーム ---------- */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:16px; margin-bottom:16px;
}
.card h2{font-size:13px; margin:0 0 12px; color:var(--accent); letter-spacing:.04em}
.grid{display:grid; gap:12px 16px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
label.f{display:grid; gap:4px; font-size:12px; color:var(--muted)}
label.f > input, label.f > select, label.f > textarea{
  padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:#fff;
  color:var(--ink); width:100%;
}
label.f textarea{min-height:80px; resize:vertical; line-height:1.6}
.hint{font-size:11px; color:var(--muted); margin-top:6px}

/* ---------- 明細テーブル ---------- */
.rows{width:100%; border-collapse:collapse; font-size:12px}
.rows th,.rows td{border:1px solid var(--line); padding:0}
.rows thead th{
  background:#eef2f6; padding:6px 4px; font-size:11px; font-weight:700;
  color:var(--accent); white-space:nowrap;
}
.rows thead th.grp{background:var(--accent); color:#fff; letter-spacing:.08em}
.rows thead th.grp.prop{background:#8a3d10}
.rows td input,.rows td textarea{
  width:100%; border:0; padding:5px 6px; background:transparent; font:inherit;
}
.rows td textarea{resize:vertical; min-height:34px; line-height:1.35}
.rows td input:focus,.rows td textarea:focus{outline:2px solid #9dc0e2; outline-offset:-2px}
.rows td.num input{text-align:right}
.rows tbody tr:nth-child(even) td{background:#fafbfc}
.rows td.ops{white-space:nowrap; text-align:center; background:#fff}
.rows td.ops button{border:0; background:transparent; color:var(--muted); padding:2px 5px}
.rows td.ops button:hover{color:var(--accent)}
.rows col.sep{width:8px}
.rows td.sep,.rows th.sep{background:#eef2f6; border-top:0; border-bottom:0}

/* ---------- 読み取り ---------- */
.drop{
  border:2px dashed #b9c4cf; border-radius:10px; padding:34px; text-align:center;
  color:var(--muted); background:#fbfcfd;
}
.drop.hot{border-color:var(--accent); background:var(--accent-weak); color:var(--accent)}
.filelist{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:6px}
.filelist li{
  display:flex; align-items:center; gap:10px; font-size:12px;
  border:1px solid var(--line); border-radius:6px; padding:6px 10px; background:#fff;
}
.filelist .sz{color:var(--muted); margin-left:auto}
.doc{border:1px solid var(--line); border-radius:8px; margin-bottom:12px; background:#fff}
.doc > summary{padding:10px 14px; cursor:pointer; font-weight:600; font-size:13px}
.doc .in{padding:0 14px 14px; font-size:12px}
.badge{
  font-size:11px; padding:2px 8px; border-radius:999px; margin-left:8px;
  background:var(--accent-weak); color:var(--accent); font-weight:600;
}
.badge.low{background:#fdeaea; color:var(--danger)}
.kv{display:grid; grid-template-columns:150px 1fr; gap:2px 12px; font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.evi{
  margin:10px 0 0; padding:8px 12px; background:#f7f9fb; border-left:3px solid #c4d5e6;
  font-size:11px; color:#4a5560; white-space:pre-wrap; max-height:220px; overflow:auto;
}
.warn{
  margin:10px 0 0; padding:8px 12px; background:#fff8e6; border-left:3px solid #e0b552;
  font-size:12px; color:var(--warn);
}
.toast{
  position:fixed; right:20px; bottom:20px; z-index:50; display:grid; gap:8px;
}
.toast div{
  background:#25303b; color:#fff; padding:10px 16px; border-radius:6px; font-size:13px;
  box-shadow:0 6px 20px rgba(0,0,0,.2);
}
.toast div.err{background:var(--danger)}

/* ---------- 比較表プレビュー（印刷レイアウト） ---------- */
.sheet-wrap{overflow:auto; background:#5b6570; padding:22px}
.sheet{
  width:1420px; margin:0 auto; background:#fff; padding:20px 26px 26px;
  font-family:"Yu Gothic UI","Meiryo",sans-serif; color:#000;
  box-shadow:0 4px 24px rgba(0,0,0,.3);
}
.sheet .s-date{text-align:right; font-size:11px}
.sheet .s-top{display:grid; grid-template-columns:1fr auto 1fr; align-items:start; gap:16px; margin-top:2px}
.sheet .s-to{font-size:19px; font-weight:700; border-bottom:1px solid #000; padding:26px 0 8px}
.sheet .s-title{font-size:22px; font-weight:700; text-align:center; padding-top:22px}
.sheet .s-issuer{text-align:right; font-size:10.5px; line-height:1.55}
.sheet .s-issuer img{height:44px; display:block; margin-left:auto; margin-bottom:4px}
.sheet .s-band{
  border:1px solid #000; text-align:center; font-weight:700; font-size:14px;
  padding:7px; margin:18px 0 16px; letter-spacing:.12em;
}
.sheet .s-cols{display:grid; grid-template-columns:1fr 74px 1fr; gap:0; align-items:start}
.sheet .s-arrow{align-self:center; text-align:center; font-size:44px; color:#e8221a; line-height:1}
.ev{width:100%; border-collapse:collapse; font-size:10.5px; table-layout:fixed}
.ev th,.ev td{border:1px solid #000; padding:3px 4px; text-align:center; vertical-align:middle}
.ev thead th{background:#d9d9d9; font-weight:700; font-size:10px; height:26px}
.ev thead th.site{background:#fdeada}
.ev td{height:34px; white-space:pre-line; line-height:1.25}
.ev td.no{width:22px; background:#fff}
.ev td.money{text-align:right; font-variant-numeric:tabular-nums; padding-right:6px}
.ev td.money::before{content:"¥"; float:left; padding-left:1px}
.ev td.red{color:#e8221a; font-weight:700}
.ev tfoot td{background:#000; color:#fff; font-weight:700; letter-spacing:.15em}
.ev tfoot td.money{background:#fff; color:#000; letter-spacing:0}
.sum{width:64%; margin:18px 0 0; border-collapse:collapse; font-size:11px}
.sum.right{margin-left:auto}
.sum td{border:1px solid #000; padding:4px 6px}
.sum .cap{text-align:center; font-weight:700; letter-spacing:.2em; background:#fff}
.sum .lbl{text-align:center; font-weight:700; background:#fff}
.sum .val{text-align:right; font-weight:700; color:#e8221a; font-variant-numeric:tabular-nums}
.sum .val::before{content:"¥"; float:left}
.sum.cut td{background:#ffff00}
.sum.cut .val{background:#ffff00}
.sum .pct{text-align:center; font-weight:700; color:#e8221a}
.sum .pct::before{content:none}
.s-lower{display:grid; grid-template-columns:1fr 400px 1fr; gap:16px; align-items:start; margin-top:6px}
.roi{border-collapse:collapse; font-size:11px; margin:26px auto 0}
.roi td,.roi th{border:1px solid #000; padding:3px 8px; text-align:center}
.roi .cap{font-weight:700; background:#fff}
.roi .r0{background:#ff0000; color:#fff; font-weight:700}
.roi .r1{background:#00b050; color:#fff; font-weight:700}
.roi .r2{background:#00b0f0; color:#fff; font-weight:700}
.roi .amt{font-style:italic; font-weight:700; font-variant-numeric:tabular-nums}
.roi-note{text-align:center; color:#e8221a; font-weight:700; font-size:12px; margin-top:10px; line-height:1.5}
.remarks{border:1px solid #000; margin-top:26px; padding:8px 12px; font-size:10.5px; white-space:pre-wrap; min-height:110px}
.remarks-cap{font-weight:700; font-size:11px; margin-bottom:4px}

@media print{
  @page{size:A3 landscape; margin:6mm}
  body{background:#fff}
  .bar,.side,.tabs,.no-print{display:none !important}
  .app,.body,.work{display:block; height:auto; overflow:visible}
  .pane{padding:0; overflow:visible}
  .pane:not(.on){display:none !important}
  .pane.on{display:block; height:auto}
  .sheet-wrap{padding:0; background:#fff; overflow:visible}
  .sheet{width:100%; box-shadow:none; padding:0; zoom:1 !important}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar no-print">
    <img id="brandLogo" alt="Elevator Partners">
    <h1>EV保守 価格比較表 作成ツール</h1>
    <span id="dataChip" class="chip off">データフォルダ未接続</span>
    <span class="spacer"></span>
    <button id="connectBtn" class="btn">データフォルダを接続</button>
    <button id="settingsBtn" class="btn">設定</button>
  </header>

  <div class="body">
    <aside class="side no-print">
      <div class="head">
        <button id="newCaseBtn" class="btn primary">＋ 新規案件</button>
        <input id="caseSearch" type="search" placeholder="案件名・お客様名で絞り込む">
      </div>
      <ul id="caseList" class="case-list"></ul>
    </aside>

    <main class="work">
      <nav class="tabs no-print">
        <button data-pane="read" class="on">① 書類読み取り</button>
        <button data-pane="rows">② 明細</button>
        <button data-pane="cover">③ 表紙・備考</button>
        <button data-pane="preview">④ 比較表</button>
      </nav>

      <section id="pane-read" class="pane on">
        <div id="readBody"></div>
      </section>

      <section id="pane-rows" class="pane">
        <div id="rowsBody"></div>
      </section>

      <section id="pane-cover" class="pane">
        <div id="coverBody"></div>
      </section>

      <section id="pane-preview" class="pane" style="padding:0">
        <div id="previewBody"></div>
      </section>
    </main>
  </div>
</div>

<div id="toast" class="toast no-print"></div>

<script src="lib/logo.js"></script>
<script src="lib/zip.js"></script>
<script src="lib/xlsx-fill.js"></script>
<script src="lib/store.js"></script>
<script src="lib/ai.js"></script>
<script src="app.js"></script>
</body>
</html>
